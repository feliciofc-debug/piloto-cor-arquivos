services:
  db:
    image: postgres:16-alpine
    container_name: cor-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${PG_PORT}:5432"
    volumes:
      - cor_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g


  api:
    build:
      context: ./api
    container_name: cor-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8091
      DATABASE_URL_API: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${API_PORT}:8091"
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8091/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512m


  worker:
    build:
      context: ./worker
    container_name: cor-worker
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE: http://api:8091
      STORAGE_DIR: /app/storage
      WORKER_ID: worker-1
      POLL_INTERVAL_SECONDS: 3
      ORPHAN_CLEANUP_INTERVAL_SECONDS: 3600
      TMP_MAX_AGE_SECONDS: 3600
    volumes:
      - ./storage:/app/storage
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1g


  nginx:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: cor-nginx
    restart: unless-stopped
    env_file: .env
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-100m}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256m


  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  cor_pgdata:
  letsencrypt:
  certbot_www:
